<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de Capacité d'Emprunt - LULY</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      line-height: 1.5;
      color: #2c3e50;
    }

    .calculator-container {
      max-width: 450px; /* RÉDUIT de 600px à 450px */
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .header {
      background: #b5a08a;
      color: white;
      padding: 20px; /* RÉDUIT de 24px à 20px */
      text-align: center;
    }

    .header h1 {
      font-size: 1.3rem; /* RÉDUIT de 1.5rem à 1.3rem */
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem; /* RÉDUIT de 0.9rem à 0.85rem */
      opacity: 0.9;
      font-weight: 400;
    }

    .form-container {
      padding: 20px; /* RÉDUIT de 24px à 20px */
    }

    .form-group {
      margin-bottom: 18px; /* RÉDUIT de 20px à 18px */
      position: relative;
    }

    /* Barres colorées entre les sections */
    .form-group::after {
      content: '';
      position: absolute;
      bottom: -9px; /* AJUSTÉ pour la nouvelle taille */
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      border-radius: 2px;
    }

    .form-group:last-of-type::after {
      display: none;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem; /* RÉDUIT de 0.85rem à 0.8rem */
      font-weight: 500;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .input-group {
      position: relative;
    }

    .form-control {
      width: 100%;
      padding: 8px 10px; /* RÉDUIT de 10px 12px à 8px 10px */
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.85rem; /* RÉDUIT de 0.9rem à 0.85rem */
      transition: border-color 0.2s ease;
      background: #fafafa;
    }

    .form-control:focus {
      outline: none;
      border-color: #b5a08a;
      background: white;
    }

    .currency-input {
      padding-right: 30px; /* RÉDUIT de 35px à 30px */
    }

    .currency-symbol {
      position: absolute;
      right: 10px; /* RÉDUIT de 12px à 10px */
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 0.8rem; /* RÉDUIT de 0.85rem à 0.8rem */
    }

    .choice-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px; /* RÉDUIT de 8px à 6px */
      margin-top: 8px;
    }

    .choice-btn {
      padding: 6px 8px; /* RÉDUIT de 8px 12px à 6px 8px */
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
      color: #495057;
      font-size: 0.75rem; /* RÉDUIT de 0.8rem à 0.75rem */
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .choice-btn:hover {
      border-color: #b5a08a;
      background: #f0f0f0;
    }

    .choice-btn.active {
      border-color: #b5a08a;
      background: #b5a08a;
      color: white;
    }

    .slider-container {
      margin-top: 10px; /* RÉDUIT de 12px à 10px */
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #ddd;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px; /* RÉDUIT de 18px à 16px */
      height: 16px;
      border-radius: 50%;
      background: #b5a08a;
      cursor: pointer;
    }

    .slider::-moz-range-thumb {
      width: 16px; /* RÉDUIT de 18px à 16px */
      height: 16px;
      border-radius: 50%;
      background: #b5a08a;
      cursor: pointer;
      border: none;
    }

    .slider-value {
      text-align: center;
      margin-top: 6px; /* RÉDUIT de 8px à 6px */
      font-size: 0.85rem; /* RÉDUIT de 0.9rem à 0.85rem */
      font-weight: 500;
      color: #2c3e50;
    }

    .calculate-btn {
      width: 100%;
      padding: 10px; /* RÉDUIT de 12px à 10px */
      background: #b5a08a; /* CHANGÉ du vert au beige ! */
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem; /* RÉDUIT de 0.95rem à 0.9rem */
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 14px; /* RÉDUIT de 16px à 14px */
    }

    .calculate-btn:hover {
      background: #a08975; /* CHANGÉ pour correspondre au beige */
    }

    .result-container {
      margin-top: 20px; /* RÉDUIT de 24px à 20px */
      padding: 16px; /* RÉDUIT de 20px à 16px */
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }

    .result-container.show {
      display: block;
    }

    .result-amount {
      font-size: 1.6rem; /* RÉDUIT de 1.8rem à 1.6rem */
      font-weight: 600;
      color: #b5a08a;
      margin-bottom: 6px;
      text-align: center;
    }

    .result-label {
      font-size: 0.85rem; /* RÉDUIT de 0.9rem à 0.85rem */
      color: #666;
      margin-bottom: 14px; /* RÉDUIT de 16px à 14px */
      text-align: center;
    }

    .result-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px; /* RÉDUIT de 12px à 10px */
      margin-bottom: 14px; /* RÉDUIT de 16px à 14px */
    }

    .detail-card {
      background: white;
      padding: 10px; /* RÉDUIT de 12px à 10px */
      border-radius: 6px;
      text-align: center;
    }

    .detail-value {
      font-size: 1rem; /* RÉDUIT de 1.1rem à 1rem */
      font-weight: 600;
      color: #b5a08a;
      margin-bottom: 4px;
    }

    .detail-label {
      font-size: 0.7rem; /* RÉDUIT de 0.75rem à 0.7rem */
      color: #666;
    }

    .tips {
      padding: 10px; /* RÉDUIT de 12px à 10px */
      background: #fff3cd;
      border-left: 3px solid #ffc107;
      border-radius: 4px;
      font-size: 0.8rem; /* RÉDUIT de 0.85rem à 0.8rem */
      color: #856404;
    }

    @media (max-width: 768px) {
      .calculator-container {
        margin: 10px;
      }

      .choice-buttons {
        grid-template-columns: repeat(2, 1fr);
      }

      .result-details {
        grid-template-columns: 1fr;
      }

      .result-amount {
        font-size: 1.4rem; /* RÉDUIT de 1.5rem à 1.4rem */
      }
    }
  </style>
</head>
<body>
  <div class="calculator-container">
    <div class="header">
      <h1>Calculateur de Capacité d'Emprunt</h1>
      <p>Estimez votre capacité d'emprunt immobilier</p>
    </div>

    <div class="form-container">
      <form id="loanForm">
        <!-- Revenus mensuels -->
        <div class="form-group">
          <label for="income">Revenus mensuels nets</label>
          <div class="input-group">
            <input type="number" id="income" class="form-control currency-input" placeholder="1480" min="0" step="10">
            <span class="currency-symbol">€</span>
          </div>
          <div class="choice-buttons">
            <button type="button" class="choice-btn" data-value="1400">1 400 €</button>
            <button type="button" class="choice-btn" data-value="2500">2 500 €</button>
            <button type="button" class="choice-btn" data-value="3500">3 500 €</button>
            <button type="button" class="choice-btn" data-value="5000">+</button>
          </div>
        </div>

        <!-- Charges mensuelles -->
        <div class="form-group">
          <label for="expenses">Charges mensuelles (crédits, loyer actuel)</label>
          <div class="input-group">
            <input type="number" id="expenses" class="form-control currency-input" placeholder="600" min="0" step="10">
            <span class="currency-symbol">€</span>
          </div>
          <div class="choice-buttons">
            <button type="button" class="choice-btn" data-value="0">0</button>
            <button type="button" class="choice-btn" data-value="600">600 €</button>
            <button type="button" class="choice-btn" data-value="1500">1 500€+</button>
            <button type="button" class="choice-btn" data-value=""></button>
          </div>
        </div>

        <!-- Apport personnel -->
        <div class="form-group">
          <label for="downPayment">Apport personnel</label>
          <div class="input-group">
            <input type="number" id="downPayment" class="form-control currency-input" placeholder="10000" min="0" step="1000">
            <span class="currency-symbol">€</span>
          </div>
          <div class="choice-buttons">
            <button type="button" class="choice-btn" data-value="0">—</button>
            <button type="button" class="choice-btn" data-value="5000">5 000</button>
            <button type="button" class="choice-btn" data-value="10000">10 000 €</button>
            <button type="button" class="choice-btn" data-value="20000">20 000 €</button>
          </div>
        </div>

        <!-- Durée du prêt -->
        <div class="form-group">
          <label for="duration">Durée du prêt</label>
          <div class="slider-container">
            <input type="range" id="duration" class="slider" min="10" max="25" value="20" step="1">
            <div class="slider-value"><span id="durationValue">20</span> ans</div>
          </div>
        </div>

        <!-- Taux d'intérêt -->
        <div class="form-group">
          <label for="rate">Taux d'intérêt estimé</label>
          <div class="slider-container">
            <input type="range" id="rate" class="slider" min="2" max="5" value="3.8" step="0.1">
            <div class="slider-value"><span id="rateValue">3.8</span> %</div>
          </div>
        </div>

        <button type="submit" class="calculate-btn">
          Calculer ma capacité d'emprunt
        </button>
      </form>

      <div id="resultContainer" class="result-container">
        <div class="result-amount" id="resultAmount">0 €</div>
        <div class="result-label">Capacité d'emprunt maximale</div>
        
        <div class="result-details">
          <div class="detail-card">
            <div class="detail-value" id="monthlyPayment">0 €</div>
            <div class="detail-label">Mensualité</div>
          </div>
          <div class="detail-card">
            <div class="detail-value" id="totalCost">0 €</div>
            <div class="detail-label">Coût total</div>
          </div>
          <div class="detail-card">
            <div class="detail-value" id="totalInterest">0 €</div>
            <div class="detail-label">Intérêts totaux</div>
          </div>
          <div class="detail-card">
            <div class="detail-value" id="debtRatio">0%</div>
            <div class="detail-label">Taux d'endettement</div>
          </div>
        </div>

        <div class="tips">
          <strong>Conseil :</strong> <span id="tipsText">Ces résultats sont une estimation basée sur les critères bancaires standards.</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const form = document.getElementById('loanForm');
      const incomeInput = document.getElementById('income');
      const expensesInput = document.getElementById('expenses');
      const downPaymentInput = document.getElementById('downPayment');
      const durationSlider = document.getElementById('duration');
      const rateSlider = document.getElementById('rate');
      const durationValue = document.getElementById('durationValue');
      const rateValue = document.getElementById('rateValue');
      const resultContainer = document.getElementById('resultContainer');
      const resultAmount = document.getElementById('resultAmount');
      const monthlyPayment = document.getElementById('monthlyPayment');
      const totalCost = document.getElementById('totalCost');
      const totalInterest = document.getElementById('totalInterest');
      const debtRatio = document.getElementById('debtRatio');
      const tipsText = document.getElementById('tipsText');

      // Gestion des boutons de choix rapide
      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const value = this.dataset.value;
          
          // Ne rien faire si le bouton est vide
          if (value === '') return;
          
          const input = this.closest('.form-group').querySelector('input');
          
          this.closest('.choice-buttons').querySelectorAll('.choice-btn').forEach(b => {
            b.classList.remove('active');
          });
          
          this.classList.add('active');
          input.value = value;
        });
      });

      // Gestion de la saisie manuelle - retirer l'état actif des boutons
      [incomeInput, expensesInput, downPaymentInput].forEach(input => {
        input.addEventListener('input', function() {
          // Retirer l'état actif de tous les boutons du groupe
          this.closest('.form-group').querySelectorAll('.choice-btn').forEach(btn => {
            btn.classList.remove('active');
          });
        });
      });

      durationSlider.addEventListener('input', function() {
        durationValue.textContent = this.value;
      });

      rateSlider.addEventListener('input', function() {
        rateValue.textContent = parseFloat(this.value).toFixed(1);
      });

      function formatNumber(num) {
        return new Intl.NumberFormat('fr-FR').format(Math.round(num));
      }

      function calculateLoanCapacity(income, expenses, downPayment, duration, rate) {
        const maxDebtRatio = 0.35;
        const availableIncome = income * maxDebtRatio;
        const maxMonthlyPayment = Math.max(0, availableIncome - expenses);
        
        if (maxMonthlyPayment <= 0) {
          return {
            loanAmount: 0,
            monthlyPayment: 0,
            totalCost: 0,
            totalInterest: 0,
            debtRatio: 100
          };
        }

        const monthlyRate = rate / 100 / 12;
        const numberOfPayments = duration * 12;
        
        let loanAmount;
        if (monthlyRate === 0) {
          loanAmount = maxMonthlyPayment * numberOfPayments;
        } else {
          loanAmount = maxMonthlyPayment * ((1 - Math.pow(1 + monthlyRate, -numberOfPayments)) / monthlyRate);
        }

        const totalProjectCost = loanAmount + downPayment;
        const totalCost = maxMonthlyPayment * numberOfPayments;
        const totalInterest = totalCost - loanAmount;
        const actualDebtRatio = ((maxMonthlyPayment + expenses) / income) * 100;

        return {
          loanAmount: Math.max(0, loanAmount),
          totalProjectCost: totalProjectCost,
          monthlyPayment: maxMonthlyPayment,
          totalCost: totalCost,
          totalInterest: Math.max(0, totalInterest),
          debtRatio: actualDebtRatio
        };
      }

      function generateTips(income, expenses, debtRatio, loanAmount) {
        if (debtRatio > 33) {
          return "Votre taux d'endettement est élevé. Réduisez vos charges pour améliorer votre capacité.";
        }
        
        if (loanAmount < 100000) {
          return "Augmentez votre apport personnel pour accéder à de meilleurs taux d'intérêt.";
        }
        
        if (income < 3000) {
          return "Considérez un co-emprunteur pour augmenter vos revenus pris en compte.";
        }
        
        return "Profil favorable pour l'obtention d'un crédit immobilier.";
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        const income = parseFloat(incomeInput.value) || 0;
        const expenses = parseFloat(expensesInput.value) || 0;
        const downPayment = parseFloat(downPaymentInput.value) || 0;
        const duration = parseInt(durationSlider.value);
        const rate = parseFloat(rateSlider.value);

        if (income <= 0) {
          alert('Veuillez saisir vos revenus mensuels');
          return;
        }

        const results = calculateLoanCapacity(income, expenses, downPayment, duration, rate);

        resultAmount.textContent = formatNumber(results.totalProjectCost) + ' €';
        monthlyPayment.textContent = formatNumber(results.monthlyPayment) + ' €';
        totalCost.textContent = formatNumber(results.totalCost) + ' €';
        totalInterest.textContent = formatNumber(results.totalInterest) + ' €';
        debtRatio.textContent = results.debtRatio.toFixed(1) + '%';

        const tips = generateTips(income, expenses, results.debtRatio, results.loanAmount);
        tipsText.textContent = tips;

        resultContainer.classList.add('show');
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

    })();
  </script>
</body>
</html>
