<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Configuration Intemporel’home P4</title>
  <script type="module"
          src="https://unpkg.com/@google/model-viewer@1.12.0/dist/model-viewer.min.js">
  </script>
  <style>
    * { box-sizing:border-box; margin:0; padding:0 }
    html, body { height:100%; font-family:sans-serif; background:#f0f2f5 }
    #configurator {
      display:grid;
      grid-template-columns:2fr 1fr;
      height:100vh;
      gap:1rem;
      padding:1rem;
    }
    .viewer-card {
      background:#fff;
      border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position: relative;
      z-index: 1;
    }
    model-viewer {
      flex:5; width:100%; height:100%;
      background:#dddddd;
      pointer-events: all;
      touch-action: none;
    }

    /* === Panneau ÉNERGIE toujours visible + scroll === */
    #energy-summary {
      flex:2;
      background:#fff;
      border-top:1px solid #eee;
      overflow-y:auto;
      padding:1rem;
    }
    #energy-summary h3 {
      font-size:1rem;
      color:#222;
      margin-bottom:1rem;
    }
    #energy-visual {
      display:flex;
      align-items:flex-start;
      justify-content:center;
      gap:1rem;
      margin-bottom:1rem;
    }
    /* Nouvelle animation : on adapte la taille si besoin */
    #energy-visual svg.house {
      width:180px; height:180px;
    }
    /* Flèches DPE inchangées */
    #energy-visual svg.dpe {
      width:60px; height:160px;
    }
    .dpe-arrow { opacity:.2; transition:opacity .4s; }
    .dpe-arrow.active { opacity:1; }

    .energy-line {
      display:flex; justify-content:space-between;
      margin-bottom:.25rem;
    }
    .energy-bar {
      width:100%; height:6px; background:#eee;
      border-radius:3px; overflow:hidden; margin-top:.5rem;
    }
    #energy-bar-fill {
      height:100%; width:0; background:#4caf50;
      transition:width .5s;
    }
    #energy-details {
      margin-top:.5rem; font-size:.85rem; color:#555;
      line-height:1.4; max-height:120px; overflow:auto;
    }

    /* -- DIMENSIONS CARDS -- */
    .dimensions {
      flex:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      background:#fff;
      padding:1rem;
      border-top:1px solid #eee;
      border-radius:0 0 8px 8px;
      gap:1rem;
    }
    .dim-card {
      background:#fff; border:1px solid #eee;
      border-radius:6px; padding:.75rem;
      text-align:center;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
    }
    .dim-card strong { display:block; font-size:1.25rem; color:#222 }
    .dim-card span   { font-size:.85rem; color:#666 }

    /* -- CONTROLES -- */
    .controls {
      background:#fff; border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      padding:1.5rem; overflow-y:auto;
      position: relative;
      z-index: 2;
      pointer-events: auto;
    }
    .controls h2 {
      font-size:1.5rem; color:#222; margin-bottom:1rem;
    }
    .group { margin-bottom:1.5rem }
    .group h3 {
      font-size:1.1rem; color:#333; margin-bottom:.5rem;
    }
    .options { display:flex; gap:.75rem; flex-wrap:wrap }
    .option { text-align:center; width:70px }
    .swatch {
      width:100%; aspect-ratio:1;
      border:1px solid #ccc; border-radius:4px;
      cursor:pointer; position:relative;
      transition:border-color .2s;
    }
    .swatch:hover { border-color:#999 }
    .swatch.selected { border-color:#006aff }
    .swatch.selected::after {
      content:'✔'; position:absolute; top:4px; right:6px;
      color:#006aff; font-size:1rem;
    }
    .option-label { margin-top:.3rem; font-size:.75rem; color:#444 }
    .option-price { font-size:.7rem; color:#666 }

    #price-summary {
      background:#fff; border:1px solid #eee;
      border-radius:6px; padding:1rem; margin:1rem 0;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
    }
    #price-summary h3 {
      font-size:1rem; margin-bottom:.75rem; color:#222;
    }
    #price-summary .line {
      display:flex; justify-content:space-between;
      margin-bottom:.5rem; font-size:.9rem; color:#333;
    }
    #price-summary .line.total {
      font-weight:700; font-size:1.1rem;
    }

    .action-buttons { display:flex; gap:.75rem }
    .action-buttons button {
      flex:1; padding:.75rem; font-size:.95rem;
      border:none; border-radius:4px; cursor:pointer;
    }
    .btn-save { background:#f0f0f0; color:#333 }
    .btn-quote{ background:#006aff; color:#fff }

    @media (max-width:1024px){
      #configurator{ grid-template-columns:1fr }
      model-viewer{ height:50vh!important; min-height:300px }
    }
    @media (max-width:600px){
      model-viewer{ height:40vh!important; min-height:200px }
      .dimensions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

  <div id="configurator">
    <!-- 3D VIEWER -->
    <div class="viewer-card">
      <model-viewer
        id="mv"
         src="INTEMPOREL21.glb"
        exposure="0.6"
        shadow-intensity="2.5"
        shadow-softness="1"
        camera-controls
        min-camera-orbit="0deg 0deg auto"
        max-camera-orbit="360deg 90deg auto">
      </model-viewer>

      <!-- panneau ÉNERGIE avec scroll -->
      <div id="energy-summary">
        <h3>Performance énergétique estimée</h3>

        <div id="energy-visual">
          <!-- NOUVELLE ANIMATION ÉNERGÉTIQUE : ton "house" SVG complet -->

            <path xmlns="http://www.w3.org/2000/svg" d="M0 0 C26.60779577 -0.15799735 53.21521192 -0.28695157 79.82335758 -0.3626852 C92.17790072 -0.39878385 104.53213178 -0.4480016 116.88647461 -0.52807617 C127.65419342 -0.5978338 138.42168623 -0.64300468 149.18962473 -0.65861946 C154.89160954 -0.66774753 160.59294778 -0.68920811 166.29472542 -0.7401104 C171.66204111 -0.7876384 177.02844418 -0.80227775 182.39595032 -0.79175377 C184.36521808 -0.79367889 186.33451648 -0.8075951 188.30360222 -0.83443832 C203.19900525 -1.02752989 203.19900525 -1.02752989 207.68810844 1.53365898 C209.45826148 3.27307251 210.72099476 4.88600977 212 7 C212.67289063 7.73347656 213.34578125 8.46695312 214.0390625 9.22265625 C215.14595964 10.50676598 216.24989642 11.79343088 217.3515625 13.08203125 C218.40582833 14.30867704 219.48232357 15.51677525 220.5859375 16.69921875 C222 18.25 222 18.25 224 21 C223.65717974 24.12804098 222.50516653 25.91819722 220.453125 28.2421875 C219.9375 28.83386719 219.421875 29.42554688 218.890625 30.03515625 C218.34921875 30.64230469 217.8078125 31.24945313 217.25 31.875 C216.19234756 33.08041271 215.13505247 34.28613907 214.078125 35.4921875 C213.60793945 36.02183105 213.13775391 36.55147461 212.65332031 37.09716797 C210.82968958 39.11861638 210.82968958 39.11861638 208.92303181 42.07383156 C206.57674692 44.86662805 206.04096782 44.99210785 202.16758251 45.73828697 C200.63797459 45.76340349 199.10760778 45.75549282 197.57817078 45.7215271 C196.73268687 45.72665365 195.88720296 45.7317802 195.01609832 45.7370621 C192.18402741 45.74694259 189.35409102 45.71395244 186.5222168 45.68115234 C184.49194896 45.67945986 182.46167744 45.68040997 180.43141174 45.68380737 C174.91916572 45.68553042 169.40770145 45.65022962 163.89563727 45.60836363 C158.13544654 45.57088159 152.37523832 45.56733325 146.61494446 45.56021118 C135.70682 45.54155497 124.79905591 45.49230715 113.89109021 45.43211424 C101.47288177 45.36507348 89.05465621 45.33206617 76.63631189 45.30194163 C51.0906             <!-- ... et tous les autres <path> exactement comme fournis ... -->
          </svg>

          <!-- FLÈCHES DPE (inchangées) -->
          <svg class="dpe" viewBox="0 0 60 160" xmlns="http://www.w3.org/2000/svg">
            <g id="arrow-Aplus" class="dpe-arrow">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#006400"/>
              <text x="5" y="15" font-size="12" fill="#fff">A+</text>
            </g>
            <g id="arrow-A" class="dpe-arrow" transform="translate(0,20)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#2e7d32"/>
              <text x="20" y="15" font-size="12" fill="#fff">A</text>
            </g>
            <g id="arrow-B" class="dpe-arrow" transform="translate(0,40)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#558b2f"/>
              <text x="20" y="15" font-size="12" fill="#fff">B</text>
            </g>
            <g id="arrow-C" class="dpe-arrow" transform="translate(0,60)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#9ccc65"/>
              <text x="20" y="15" font-size="12" fill="#000">C</text>
            </g>
            <g id="arrow-D" class="dpe-arrow" transform="translate(0,80)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#ffeb3b"/>
              <text x="20" y="15" font-size="12" fill="#000">D</text>
            </g>
            <g id="arrow-E" class="dpe-arrow" transform="translate(0,100)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#ffb300"/>
              <text x="20" y="15" font-size="12" fill="#000">E</text>
            </g>
            <g id="arrow-F" class="dpe-arrow" transform="translate(0,120)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#f4511e"/>
              <text x="20" y="15" font-size="12" fill="#fff">F</text>
            </g>
            <g id="arrow-G" class="dpe-arrow" transform="translate(0,140)">
              <polygon points="0,0 50,0 60,10 50,20 0,20" fill="#d32f2f"/>
              <text x="20" y="15" font-size="12" fill="#fff">G</text>
            </g>
          </svg>
        </div>

        <div class="energy-line"><span>Consommation :</span><span id="energy-value">0 kWh/an</span></div>
        <div class="energy-line"><span>Classe :</span><span id="energy-class">–</span></div>
        <div class="energy-bar"><div id="energy-bar-fill"></div></div>
        <h4 style="margin-top:1rem;font-size:.9rem;color:#555">Détail par matériau</h4>
        <div id="energy-details"><i>Aucun matériau sélectionné</i></div>
      </div>

      <!-- Dimensions -->
      <div class="dimensions">
        <div class="dim-card"><strong>85 m²</strong><span>Surface</span></div>
        <div class="dim-card"><strong>3 Ch</strong><span>Chambres</span></div>
        <div class="dim-card"><strong>2 SdE</strong><span>Salles d'eau</span></div>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
      <h2>Configuration Modern’home</h2>
      <!-- … le reste de tes contrôles inchangés … -->
    </div>
  </div>

  <script>
    // --------------------------------------------------
    const energyImpact = {
      Toit:      {'#1A2E3F':3000,'#A6A6A6':3200,'#C0392B':3500},
      Pergola:   {'#FFFFFF':-200,'#000000':300},
      Murs:      {'#FFFFFF':0,'#D4C4A3':100,'#E6C7B1':150},
      Menuiserie:{'#FFFFFF':0,'#000000':50},
      Gouttiere: {'#FFFFFF':0}
    };
    function getEnergyClass(kwh){
      if(kwh<2000) return 'Aplus';
      if(kwh<2500) return 'A';
      if(kwh<3000) return 'B';
      if(kwh<3500) return 'C';
      if(kwh<4000) return 'D';
      return 'E';
    }
    // --------------------------------------------------

    window.addEventListener('DOMContentLoaded',()=>{
      const mv        = document.getElementById('mv');
      const optEl     = document.getElementById('opt-price');
      const totalEl   = document.getElementById('total-price');
      const energyEl  = document.getElementById('energy-value');
      const classEl   = document.getElementById('energy-class');
      const barFill   = document.getElementById('energy-bar-fill');
      const arrows    = Array.from(document.querySelectorAll('.dpe-arrow'));
      const basePrice = 170000;
      let   selection = {};

      const targets = {
        Menuiserie: ['acierpaint','acier','volets'],
        Gouttiere:  ['gouttiere'],
        Pergola:    ['structure'],
        Murs:       ['murs','murs2'],
        Toit:       ['toit01','toit02','toitpatio']
      };

      function hex2rgba(h){
        const v=parseInt(h.slice(1),16);
        return[
          (v>>16&255)/255,
          (v>>8 &255)/255,
          (v     &255)/255,
          1
        ];
      }

      function updateEnergy(){
        let sum=0, lines=[];
        Object.entries(selection).forEach(([cat])=>{
          const sw=document.querySelector(`.group[data-cat="${cat}"] .swatch.selected`);
          if(!sw)return;
          const col=sw.dataset.color, imp=energyImpact[cat][col]||0;
          sum+=imp;
          lines.push(`• ${cat} – ${sw.nextElementSibling.textContent}: ${imp>0?'+':''}${imp} kWh/an`);
        });
        energyEl.textContent=`${sum} kWh/an`;
        const cls=getEnergyClass(sum);
        classEl.textContent=cls==='Aplus'?'A+':cls;
        barFill.style.width=`${Math.min(100,Math.round(sum/4000*100))}%`;
        arrows.forEach(a=>a.classList.remove('active'));
        document.getElementById(`arrow-${cls}`).classList.add('active');
        document.getElementById('energy-details').innerHTML=
          lines.length?lines.join('<br>'):'<i>Aucun matériau sélectionné</i>';
      }

      mv.addEventListener('load',()=>{
        const mats=mv.model.materials;
        document.querySelectorAll('.group').forEach(group=>{
          const cat=group.dataset-cat, frags=targets[cat]||[];
          group.querySelectorAll('.swatch').forEach(sw=>{
            sw.addEventListener('click',()=>{
              group.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));
              sw.classList.add('selected');
              selection[cat]=+sw.dataset-cost;
              const tot=Object.values(selection).reduce((a,b)=>a+b,0);
              optEl.textContent=`${tot.toLocaleString('fr-FR')} €`;
              totalEl.textContent=`${(basePrice+tot).toLocaleString('fr-FR')} €`;
              const rgba=hex2rgba(sw.dataset.color);
              mats.forEach(m=>{
                const name=m.name.toLowerCase();
                if(frags.some(f=>name.includes(f))){
                  m.pbrMetallicRoughness.setBaseColorFactor(rgba);
                  m.pbrMetallicRoughness.setMetallicFactor(1);
                  m.pbrMetallicRoughness.setRoughnessFactor(1);
                }
              });
              updateEnergy();
            });
          });
          const first=group.querySelector('.swatch');
          if(first) first.click();
        });
        updateEnergy();
      });
    });
  </script>
</body>
</html>
